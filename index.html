/* ======================================================================
   MAIN RENDER DISPATCH
   (decides desktop vs. mobile layout on every state change)
   ====================================================================== */
function render(){
  /* The whole UI is rebuilt from scratch (innerHTML) on every state change,
     which is simple and reliable but has one real cost: if the user is
     mid-keystroke in a text input (like the search boxes) when a re-render
     happens, the browser treats the rebuilt input as a brand-new element,
     drops focus, and -- critically on mobile -- dismisses the on-screen
     keyboard, forcing a re-tap for every single letter typed. This captures
     the focused field (by id) and its cursor position before rebuilding,
     then restores both afterwards so typing feels continuous. */
  var root=document.getElementById('root');
  var active=document.activeElement;
  var focusId=null,selStart=null,selEnd=null;
  if(active&&root&&root.contains(active)&&active.id&&(active.tagName==='INPUT'||active.tagName==='TEXTAREA')){
    focusId=active.id;
    try{selStart=active.selectionStart;selEnd=active.selectionEnd;}catch(e){}
  }
  if(isMobile()){
    renderMobile();
  } else {
    renderDesktop();
  }
  renderReadOnlyBanner();
  if(focusId){
    var el=document.getElementById(focusId);
    if(el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA')){
      el.focus();
      if(selStart!==null&&el.setSelectionRange){
        try{el.setSelectionRange(selStart,selEnd);}catch(e){}
      }
    }
  }
}

/* ======================================================================
   DESKTOP: FULL-PAGE RENDERER
   (PIN screen, all five tabs, header, sidebar -- the whole desktop UI)
   ====================================================================== */
/* ============================================================
   BUSINESS PICKER
   Shown instead of the normal PIN lock screen only when there's no
   ?key= in the URL AND more than one business is registered on this
   device (or none at all yet). Opening a business's own personal link
   always skips this entirely and goes straight to that business, same
   as a single-business customer always has -- this only appears for a
   device/browser that's been used to add more than one business.
   ====================================================================== */
/* ============================================================
   GROUP OWNER LOGIN
/* ============================================================
   FORGOT PIN
   Since PINs live only in the browser's own storage (never on the
   server), there's no email/SMS-based reset possible -- instead this is
   a deliberate two-step handshake: the person contacts their provider
   outside the app (call, WhatsApp, whatever), the admin sets a specific
   new PIN for them in the back office, and only then does tapping
   "Forgot PIN?" here actually apply it. Works the same way for a single
   business's owner PIN and for a group's shared PIN -- the mode
   parameter picks which backend check and which local storage key this
   applies to.
   ====================================================================== */
var forgotPinMode=null; // null | 'business' | 'group'
var forgotPinStatus='idle'; // idle | checking | applied | denied
function startForgotPin(mode){
  forgotPinMode=mode;forgotPinStatus='checking';render();
  var url=mode==='group'?(SAAS_API_URL+'/api/auth/group-pin-reset-check'):(SAAS_API_URL+'/api/auth/pin-reset-check');
  var headers=mode==='group'?{'x-group-key':GROUP_KEY}:{'x-api-key':SAAS_API_KEY};
  fetch(url,{method:'POST',headers:headers})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.authorized&&d.pin){
        if(mode==='group'){
          localStorage.setItem('genlec_group_pin_'+bizHash(GROUP_KEY),d.pin);
        }else{
          localStorage.setItem(nsKey('genlec_pin'),d.pin);
        }
        forgotPinStatus='applied';render();
        setTimeout(function(){
          var wasBusiness=(mode==='business');
          forgotPinMode=null;forgotPinStatus='idle';
          if(wasBusiness)authOK();else{groupPinEntry='';loadGroupBusinesses();}
        },1300);
      }else{
        forgotPinStatus='denied';render();
      }
    })
    .catch(function(){forgotPinStatus='denied';render();});
}
function cancelForgotPin(){forgotPinMode=null;forgotPinStatus='idle';render();}
function renderForgotPinScreen(){
  var h='<div class="lock-screen">';
  h+='<div class="lock-title">Forgot PIN</div>';
  if(forgotPinStatus==='checking'){
    h+='<div class="lock-sub">Checking...</div>';
  }else if(forgotPinStatus==='denied'){
    h+='<div class="lock-sub" style="max-width:280px;">No new PIN has been set for you yet. Contact your provider and ask them to set one for you, then try again.</div>';
    h+='<button class="btn btn-sm" style="margin-top:18px;" onclick="startForgotPin(\''+forgotPinMode+'\')">Try again</button>';
    h+='<button class="btn btn-sm" style="margin-top:8px;" onclick="cancelForgotPin()">&#8592; Back</button>';
  }else if(forgotPinStatus==='applied'){
    h+='<div class="lock-sub">Your new PIN is set -- continuing...</div>';
  }
  h+='</div>';
  return h;
}

/* ============================================================
   GROUP OWNER LOGIN
   One key + one PIN covering every business in a group (e.g. a
   Polmaise owner who should see both Vakasha Lodge and Swaziland
   Boilers). Reuses the exact same PIN-pad component as everything
   else in this app. Once unlocked, picking a business here hands off
   to the completely unchanged single-business flow -- from that point
   on, this business behaves exactly as if its own personal link had
   been opened directly.
   ====================================================================== */
var groupPinEntry='',groupPinLocked=false,groupPinLockUntil=0,groupPinAttempts=0;
var groupAuthed=false,groupName='',groupBusinesses=null,groupLoadError='';
var groupOverviewMonth=new Date().getMonth();
function getGroupPIN(groupKey){return localStorage.getItem('genlec_group_pin_'+bizHash(groupKey||GROUP_KEY))||'1234';}
function tryGroupPinDigit(d){
  if(groupPinLocked&&Date.now()<groupPinLockUntil){render();return;}
  if(d==='del'){groupPinEntry=groupPinEntry.slice(0,-1);render();return;}
  if(groupPinEntry.length>=4)return;
  groupPinEntry+=d;render();
  if(groupPinEntry.length===4){
    if(groupPinEntry===getGroupPIN()){
      groupPinAttempts=0;groupPinEntry='';
      loadGroupBusinesses();
    }else{
      groupPinAttempts++;groupPinEntry='';haptic(100);
      if(groupPinAttempts>=3){groupPinLocked=true;groupPinLockUntil=Date.now()+300000;}
      render();
    }
  }
}
/* Same idea as applyPWABranding(), but for the group picker itself --
   this was missing entirely before, which is exactly why "Add to Home
   Screen" from the group picker screen produced a generic browser icon
   and just said "Wagely" instead of the group's own name: nothing had
   ever set the manifest/icon for that screen specifically. Uses the
   Wagely brand mark as the icon source (groups don't have their own
   uploaded logo the way a business does), and points the installed
   icon's start_url at this group's own link so reopening it returns to
   the group picker, not a specific business. */
function applyGroupPWABranding(groupNameParam){
  var appLabel=(groupNameParam?groupNameParam+' Wages':'Wagely');
  document.title=appLabel;

  if(appleTitle)appleTitle.setAttribute('content',appLabel);

  generateAppIcon(groupNameParam,window.WAGELY_ICON,192,function(icon192){
    var appleIcon=document.getElementById('pwa-apple-icon');
    if(appleIcon)appleIcon.setAttribute('href',icon192);
    var fav192=document.getElementById('pwa-favicon-192');

/* Sums each active employee's real monthly payout using the exact same
   po() calculation the business's own Monthly Payroll tab uses -- not
   an approximation. po() is a pure function of the employee record and
   month index with no dependency on which business's data happens to
   be "currently loaded" in G, so it's safe to call directly against
   another business's fetched employee list like this. */
function computeBusinessTotals(business,month){
  var active=(business.emps||[]).filter(function(e){return e.active!==false;});
  var total=active.reduce(function(sum,e){return sum+po(e,month);},0);
  return {total:Math.round(total*100)/100,headcount:active.length};
}

  swipeStartX=e.touches[0].clientX;

/* ======================================================================
   IN-PLACE BUSINESS SWITCHING (no page reload)
   Everything above this point runs once, at real page load. This does
   the same work again, on demand, without reloading the page -- every
   piece of state that's scoped to "whichever business is currently
   open" gets explicitly reset here, rather than relying on a fresh page
   load to reset it implicitly. That list, and why each one matters:
     - SAAS_API_KEY/GROUP_KEY/BIZ_NS/SK/BIO_KEY: the business's identity
       itself and everything namespaced from it (localStorage keys,
       WebAuthn credential ID) -- get this wrong and it's not a cosmetic
       bug, it's one business's data appearing under another's key.
     - G: rebuilt from scratch via freshG(), never patched in place, so
       no field from the previous business can survive by accident.
     - syncTimer: cancelled before anything else changes -- a pending
       save firing after the switch would otherwise write the new
       business's in-memory state to whichever key SK pointed to at the
       moment the timer fires, which is a real corruption risk once SK
       has already moved on to the new business.
     - undoStack/swipeEmpId/longPressTimer: all reference specific
       employee IDs from the business being left. An employee ID is
       just a number -- if the new business happens to reuse the same
       ID, a stale undo or a delayed long-press could silently act on
       the wrong person's record in the new business.
     - Every PIN-entry, portal, forgot-PIN, and group-picker field: reset
       so the new business starts at a genuinely clean lock screen, not
       mid-way through whatever the previous business's screen was
       doing.
   ====================================================================== */
function switchToBusinessInPlace(opts){
  opts=opts||{};

     real page load: switching to "no business, no group" with exactly
     one business registered on this device should land back on that
     business's own lock screen, not a picker with nothing meaningful
     to pick from. Only applies when the caller didn't already ask for
     a specific key or group. */
  if(!newKey&&!newGroupKey){
    var _regList=getRegisteredBusinesses();
    if(_regList.length===1)newKey=_regList[0].key;
  }

  clearTimeout(syncTimer);
  clearTimeout(undoTimer);undoStack=null;
  clearTimeout(longPressTimer);longPressFired=false;swipeEmpId=null;

  try{history.replaceState({},'',window.location.pathname+newSearch);}catch(e){}

  SAAS_API_KEY=newKey;
  GROUP_KEY=newGroupKey;

  pinEntry='';pinLocked=false;pinLockUntil=0;pinAttempts=0;
  localSaveFailed=false;
  readOnlyNoticeShowing=false;
  subscriptionBlocked=false;subscriptionBlockedMsg='';

  forgotPinMode=null;forgotPinStatus='idle';

  groupAuthed=false;groupName='';groupBusinesses=null;groupLoadError='';
  groupOverviewMonth=new Date().getMonth();

  modalSwipeStartY=0;modalSwipeEl=null;
  ptrStart=0;ptrActive=false;
  syncStatus='';lastActive=Date.now();lastSyncedUpdatedAt=0;

  BIZ_NS=newKey?bizHash(newKey):'';
  SK=nsKey('genlec_payroll_'+CY);
  BIO_KEY=nsKey('genlec_webauthn_cred');
  sv=loadS();

  G=freshG(sv,ROLLOVER_PREV_YEAR);

  autoAuthedViaGroup=false;autoGroupPickerLoading=false;
  if(SAAS_API_KEY&&!GROUP_KEY){
    var _ags=null;
    try{_ags=sessionStorage.getItem('genlec_group_session');}catch(e){}
    if(_ags&&_ags===getGroupForCurrentBusiness()){
      autoAuthedViaGroup=true;
      var _sal=null;
      try{_sal=sessionStorage.getItem('genlec_group_access_'+bizHash(SAAS_API_KEY));}catch(e){}
      if(_sal==='readonly')G.groupReadOnly=true;
      var _sac=null;
      try{_sac=JSON.parse(sessionStorage.getItem('genlec_group_approvalctx_'+bizHash(SAAS_API_KEY))||'null');}catch(e){}
      if(_sac)G.viewingAsGroupOwner=_sac;
    }
  }
  if(GROUP_KEY){
    var _ags2=null;

  }

  if(autoAuthedViaGroup)authOK(null,true);
  else if(autoGroupPickerLoading)loadGroupBusinesses();
  else render();

  updateOfflineBanner();
  if(SAAS_API_KEY){
    validateSubscription(function(ok,errMsg){
      if(!ok){subscriptionBlockedMsg=errMsg||'This subscription is not active.';}
      render();
    });
    if(navigator.onLine)loadFromCloud(function(ok){if(ok)render();});
  }
}




</script>
