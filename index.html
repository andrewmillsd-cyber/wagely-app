<!-- The manifest and touch-icon links below are placeholders swapped out at
     runtime by applyPWABranding() once this customer's business name/logo
     load -- see that function. Every customer runs this identical file, so
     "Add to Home Screen" naming/icon can't be baked in statically; it has
     to be generated per-tenant in JS before the person taps "Add to Home
     Screen", since that's when iOS/Android actually read these tags. -->
<link rel="manifest" id="pwa-manifest-link" href=""/>
<link rel="apple-touch-icon" id="pwa-apple-icon" sizes="180x180" href=""/>
<meta name="apple-mobile-web-app-title" id="pwa-apple-title" content="Wagely"/>
<link rel="icon" type="image/png" sizes="192x192" id="pwa-favicon-192" href=""/>
<link rel="icon" type="image/png" sizes="32x32" id="pwa-favicon-32" href=""/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

/* Skeleton placeholder shown only on a genuinely fresh device (no local
   cache yet) while the very first cloud fetch is still in flight --
   without this, a brand-new device briefly shows an empty payroll table,
   which reads as "this business has no employees" rather than "your
   data is on its way", right up until the real data pops in. */
@keyframes shimmer{0%{background-position:-300px 0;}100%{background-position:300px 0;}}
.skel-bar{height:13px;border-radius:6px;background:linear-gradient(90deg,#edeff2 25%,#e1e4e9 37%,#edeff2 63%);background-size:600px 100%;animation:shimmer 1.3s ease-in-out infinite;}
.skel-row td{padding:14px 16px;}
.skel-card{background:#fff;border-radius:16px;border:1px solid #e2e8f0;margin-bottom:10px;padding:16px;}
.skel-card .skel-bar+.skel-bar{margin-top:8px;}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100vh;background:#f8fafc;font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#334155;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;}
input,select,textarea,button{font-family:inherit;}
#app{max-width:1600px;margin:0 auto;padding:20px 16px;}
.app-header{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:12px;padding:10px 20px;margin-bottom:24px;border:1px solid #e2e8f0;gap:12px;flex-wrap:wrap;box-shadow:0 1px 3px 0 rgb(0 0 0 / 0.07);}
.logo-wrap{display:flex;align-items:center;gap:10px;}
.logo-wrap img{height:32px;width:auto;max-width:160px;}
.app-title{font-size:14px;font-weight:700;color:#111;}
.app-subtitle{font-size:11px;color:#9ca3af;margin-top:1px;}
.header-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
#sync-badge{font-size:11px;color:#059669;font-weight:600;min-width:44px;}
.month-sel-wrap{display:flex;align-items:center;gap:6px;background:#f9fafb;border:1px solid #eaecf0;border-radius:8px;padding:5px 10px;}
.month-sel-wrap select{border:none;background:transparent;font-size:13px;font-weight:600;color:#111;cursor:pointer;outline:none;}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px;}
.hide-bank-cols .detail-col{display:none;}
html.dark-mode{filter:invert(1) hue-rotate(180deg);background:#fff;}
/* Filters on a parent apply to everything painted inside it, images
   included -- without this, every uploaded business logo (and the
   Wagely mark itself) would render with corrupted, inverted colors in
   dark mode. Filters compose down the ancestor chain, so inverting
   these a second time cancels the parent's invert back out for them
   specifically, while the rest of the page still gets the dark
   treatment. The lock/PIN/portal screens further below already exempt
   themselves entirely from the top-level invert (net zero already), so
   this same blanket img/svg rule would flip them a third time and
   corrupt them again there -- the second rule below excludes exactly
   those three containers to keep the two exemptions from stacking. */
html.dark-mode img,html.dark-mode svg{filter:invert(1) hue-rotate(180deg);}
html.dark-mode .lock-screen img,html.dark-mode .lock-screen svg,
html.dark-mode .m-pin-screen img,html.dark-mode .m-pin-screen svg,
html.dark-mode .employee-portal img,html.dark-mode .employee-portal svg
{filter:none;}
.sysdlg-backdrop{position:fixed;inset:0;background:rgba(15,23,42,0.55);display:flex;align-items:center;justify-content:center;z-index:99999;padding:20px;animation:sysdlg-fade 0.15s ease;}
.sysdlg{background:#fff;border-radius:16px;max-width:360px;width:100%;padding:22px 22px 16px;box-shadow:0 20px 40px rgba(0,0,0,0.25);animation:sysdlg-pop 0.16s ease;}
.sysdlg-msg{font-size:14px;line-height:1.55;color:#1e293b;margin-bottom:18px;white-space:pre-line;}
.sysdlg-actions{display:flex;justify-content:flex-end;gap:8px;}
.sysdlg-btn{padding:9px 18px;border-radius:9px;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;background:#f1f5f9;color:#334155;}
.sysdlg-primary{background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff;}
@keyframes sysdlg-fade{from{opacity:0;}to{opacity:1;}}
@keyframes sysdlg-pop{from{opacity:0;transform:scale(0.94) translateY(6px);}to{opacity:1;transform:scale(1) translateY(0);}}
html.dark-mode .lock-screen,html.dark-mode .m-pin-screen,html.dark-mode .employee-portal{filter:invert(1) hue-rotate(180deg);}
.metric{background:#fff;border-radius:12px;padding:20px 22px;border:1px solid #e2e8f0;box-shadow:0 1px 3px 0 rgb(0 0 0 / 0.07);}
.ml{font-size:0.7rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:10px;}
.mv{font-size:26px;font-weight:800;letter-spacing:-0.5px;color:#0f172a;}
.mv.green{color:#16a34a;}
.mv-sub{font-size:12px;color:#94a3b8;margin-top:5px;}
.months-bar{display:flex;gap:3px;margin-top:10px;}
.month-pip{flex:1;height:4px;border-radius:2px;background:#e5e7eb;}
.month-pip.done{background:#059669;}
.section-card{background:#fff;border-radius:12px;border:1px solid #e2e8f0;margin-bottom:16px;overflow:hidden;box-shadow:0 4px 6px -1px rgb(0 0 0 / 0.07);}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid #e2e8f0;}
.section-title{font-size:13px;font-weight:700;color:#0f172a;display:flex;align-items:center;gap:8px;}
.ptable{width:100%;border-collapse:separate;border-spacing:0;background:#ffffff;border-radius:12px;box-shadow:0 4px 6px -1px rgb(0 0 0 / 0.1);overflow:hidden;}
.ptable thead tr{background:#f1f5f9;}

.ptable tr:last-child td{border-bottom:none;}
.ptable tr:hover td{background:#f8fafc;}
.ptable .total-row td{font-weight:700;background:#f1f5f9;border-top:2px solid #e2e8f0;}
.payout-val{font-size:13px;font-weight:700;color:#059669;}
.muted-val{color:#d1d5db;}
.denom-val-cell{text-align:center;font-size:12px;font-weight:600;color:#111;}
.denom-val-cell.zero{color:#d1d5db;font-weight:400;}
.denom-header{text-align:center;font-size:10px;}
.employee-name{font-weight:600;color:#111;}
.emp-num{font-size:11px;color:#9ca3af;margin-top:1px;}
.emp-cell{display:flex;align-items:center;gap:10px;}
.av{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.av-blue{background:#dbeafe;color:#1d4ed8;}.av-teal{background:#d1fae5;color:#065f46;}.av-coral{background:#fee2e2;color:#b91c1c;}.av-purple{background:#ede9fe;color:#6d28d9;}
.btn{padding:7px 14px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;cursor:pointer;font-size:12px;font-weight:600;color:#334155;transition:all 0.15s;}
.btn:hover{background:#f1f5f9;transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,0.08);}
.btn:active{transform:scale(0.96);opacity:0.8;box-shadow:none;}
.btn-navy{background:#1e293b;color:#fff;border-color:#1e293b;}
.btn-navy:hover{background:#0f172a;box-shadow:0 4px 12px rgba(30,41,59,0.25);}
.btn-green{background:#2563eb;color:#fff;border-color:#2563eb;}
.btn-green:hover{background:#1d4ed8;box-shadow:0 4px 12px rgba(37,99,235,0.25);}
.btn-red{background:#fff;color:#dc2626;border-color:#fecaca;}
.btn-red:hover{background:#fef2f2;}
.btn-amber{background:#fffbeb;color:#d97706;border-color:#fde68a;}
.btn-sm{padding:5px 12px;font-size:11px;border-radius:6px;}
.btn-icon{width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:6px;}
.btn-primary{background:#2563eb;color:#fff;padding:10px 20px;border-radius:8px;font-weight:600;transition:all 0.2s;border:none;cursor:pointer;}
.btn-primary:hover{background:#1d4ed8;transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,0.2);}
.badge{font-size:11px;padding:4px 12px;border-radius:9999px;display:inline-block;font-weight:500;}
.b-paid{background:#dcfce7;color:#166534;}
.b-locked{background:#dcfce7;color:#166534;font-size:10px;padding:2px 6px;border-radius:9999px;}
.vb{background:#dbeafe;color:#1d4ed8;font-size:10px;padding:2px 6px;border-radius:9999px;}
.reset-badge{background:#fef9c3;color:#854d0e;font-size:10px;padding:2px 6px;border-radius:9999px;font-weight:600;}
.tabs{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap;background:#fff;padding:5px;border-radius:10px;border:1px solid #e2e8f0;box-shadow:0 1px 3px 0 rgb(0 0 0 / 0.05);}
.tab{padding:7px 16px;border-radius:7px;border:none;background:transparent;cursor:pointer;font-size:12px;font-weight:600;color:#64748b;transition:all 0.15s;}

.mw{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,0.5);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;z-index:100;overflow-y:auto;animation:mw-fade 0.15s ease;}

@keyframes mw-fade{from{opacity:0;}to{opacity:1;}}

.fr{margin-bottom:12px;}

.fr .hint{font-size:11px;color:#9ca3af;margin-top:3px;}
.fa{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
.bs{padding:9px 20px;border-radius:8px;border:none;background:#111827;color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:transform 0.1s ease,opacity 0.1s ease;}

.bc{padding:9px 20px;border-radius:8px;border:1px solid #e5e7eb;background:#fff;color:#6b7280;font-size:13px;font-weight:600;cursor:pointer;transition:transform 0.1s ease,opacity 0.1s ease;}
.bc:active{transform:scale(0.96);opacity:0.85;}

.swarn{background:#fffbeb;border-radius:8px;padding:7px 12px;margin-bottom:12px;font-size:12px;color:#d97706;border:1px solid #fde68a;}
.eg{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:10px;}
.estat{background:#f9fafb;border-radius:8px;padding:8px 10px;border:1px solid #f3f4f6;}
.esl{font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:0.4px;margin-bottom:3px;}
.esv{font-size:14px;font-weight:700;}
.lb{background:#e5e7eb;border-radius:3px;height:5px;margin:6px 0;}
.lf{background:#059669;border-radius:3px;height:5px;}
.ndel{font-size:11px;color:#dc2626;cursor:pointer;border:none;background:transparent;padding:0;font-weight:600;}
.nta{flex:1;padding:7px 10px;border-radius:8px;border:1px solid #e5e7eb;font-size:12px;resize:none;line-height:1.5;}
.nab{padding:7px 12px;border-radius:8px;border:none;background:#111827;color:#fff;font-size:12px;font-weight:600;cursor:pointer;}
@media print{.mw,.tabs,.header-actions{display:none;}}
@keyframes spin{to{transform:rotate(360deg);}}

/* Mobile layout */
.mobile-app { display: none; }

  .desktop-app { display: none !important; }
  .mobile-app { display: block; }
  body { background: #f8fafc; }
}
@media (min-width: 768px) {
  .mobile-app { display: none !important; }
  .desktop-app { display: block; }
}

/* Mobile specific styles */
.m-header { background: #fff; padding: 20px 20px 16px; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 30; }
.m-hero { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); border-radius: 24px; padding: 24px; color: #fff; margin: 0 16px 20px; position: relative; overflow: hidden; box-shadow: 0 8px 24px rgba(99,102,241,0.3); }
.m-hero h2 { font-size: clamp(24px, 8vw, 36px); font-weight: 800; margin: 8px 0 16px; letter-spacing: -1px; }
.m-hero p { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.75; }
.m-hero-blob1 { position: absolute; width: 160px; height: 160px; background: rgba(255,255,255,0.08); border-radius: 50%; right: -40px; top: -40px; }
.m-hero-blob2 { position: absolute; width: 160px; height: 160px; background: rgba(99,102,241,0.15); border-radius: 50%; left: -40px; bottom: -40px; }
.m-chip { background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 9999px; font-size: 11px; font-weight: 600; display: inline-block; margin-right: 8px; backdrop-filter: blur(8px); }
.m-chip-amber { background: rgba(251,191,36,0.3); color: #fef3c7; }
.m-section { padding: 0 16px; margin-bottom: 20px; }
.m-section-title { font-size: 16px; font-weight: 700; color: #0f172a; margin-bottom: 12px; }
.m-card { background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; margin-bottom: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); transition: transform 0.12s ease, box-shadow 0.12s ease; }
.m-card:active { transform: scale(0.98); box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
.m-card-row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
.m-avatar { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
.m-emp-name { font-size: 14px; font-weight: 700; color: #0f172a; }
.m-emp-sub { font-size: 11px; color: #94a3b8; margin-top: 1px; }
.m-payout { font-size: 16px; font-weight: 800; color: #6366f1; }
.m-status-paid { background: #dcfce7; color: #166534; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 9999px; }
.m-status-pending { background: #fef9c3; color: #854d0e; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 9999px; }
.m-deductions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 16px 14px; border-top: 1px solid #f1f5f9; margin-top: 4px; }
.m-deduct-item { background: #f8fafc; border-radius: 10px; padding: 8px; text-align: center; }
.m-deduct-label { font-size: 10px; color: #94a3b8; font-weight: 600; text-transform: uppercase; }
.m-deduct-val { font-size: 13px; font-weight: 700; color: #334155; margin-top: 2px; }
.m-deduct-val.red { color: #dc2626; }
.m-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 16px; margin-bottom: 20px; }
.m-stat-card { background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.m-stat-label { font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }

/* Bottom nav */
.m-bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 430px; margin: 0 auto; background: rgba(255,255,255,0.92); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid #e2e8f0; padding: 8px 20px calc(20px + env(safe-area-inset-bottom)); display: flex; justify-content: space-between; align-items: center; z-index: 40; }
.m-nav-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; cursor: pointer; color: #94a3b8; padding: 4px 8px; transition: color 0.15s; }
.m-nav-btn.active { color: #6366f1; }
.m-nav-btn svg { width: 24px; height: 24px; }
.m-nav-btn span { font-size: 10px; font-weight: 700; }
.m-nav-fab { width: 52px; height: 52px; background: linear-gradient(135deg, #6366f1, #a855f7); border-radius: 18px; border: 4px solid #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 16px rgba(99,102,241,0.4); margin-top: -20px; transition: transform 0.15s; }
.m-nav-fab:active { transform: scale(0.94); }

/* Mobile modal */
.m-modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,0.55); backdrop-filter: blur(4px); z-index: 100; display: flex; align-items: flex-end; justify-content: center; animation: mmodal-fade 0.15s ease; }
.m-modal { background: #fff; border-radius: 24px 24px 0 0; padding: 20px 20px 40px; width: 100%; max-width: 430px; max-height: 90vh; overflow-y: auto; will-change: transform; animation: mmodal-slide 0.22s cubic-bezier(0.16,1,0.3,1); }
@keyframes mmodal-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes mmodal-slide { from { transform: translateY(100%); } to { transform: translateY(0); } }
.m-modal-handle { width: 40px; height: 4px; cursor: grab; background: #e2e8f0; border-radius: 2px; margin: 0 auto 16px; }
.m-modal h2 { font-size: 18px; font-weight: 800; margin-bottom: 16px; color: #0f172a; }
.m-input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid #e2e8f0; background: #f8fafc; color: #0f172a; font-size: 14px; margin-top: 4px; outline: none; font-family: inherit; }
.m-input:focus { border-color: #6366f1; background: #fff; }
.m-label { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.04em; margin-top: 12px; display: block; }
.m-btn-primary { width: 100%; padding: 14px; background: linear-gradient(135deg, #6366f1, #a855f7); color: #fff; border: none; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 16px; font-family: inherit; }
.m-btn-primary:active { opacity: 0.9; transform: scale(0.99); }
.m-btn-cancel { width: 100%; padding: 14px; background: #f1f5f9; color: #64748b; border: none; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; font-family: inherit; }

/* Mobile PIN */
.m-pin-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: calc(32px + env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom)); background: linear-gradient(160deg, #f8fafc 0%, #eef2ff 100%); }
.m-pin-logo img { height: 52px; width: auto; max-width: 240px; }
.m-pin-title { font-size: 22px; font-weight: 800; color: #0f172a; }
.m-pin-sub { font-size: 13px; color: #64748b; text-align: center; }
.m-pin-dots { display: flex; gap: 14px; }
.m-pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #c7d2fe; background: transparent; transition: all 0.15s; }
.m-pin-dot.filled { background: #6366f1; border-color: #6366f1; transform: scale(1.1); }
.m-pin-pad { display: grid; grid-template-columns: repeat(3, 72px); gap: 12px; }
.m-pin-btn { width: 72px; height: 72px; border-radius: 50%; border: 1.5px solid #e2e8f0; background: #fff; font-size: 22px; font-weight: 700; cursor: pointer; color: #0f172a; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: all 0.1s; font-family: inherit; }
.m-pin-btn:active { transform: scale(0.94); background: #f1f5f9; }
.m-pin-err { font-size: 13px; color: #ef4444; font-weight: 600; }

/* Fade animation */
@keyframes mFadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.m-fade { animation: mFadeIn 0.25s ease-out; }
.desktop-app { animation: mFadeIn 0.2s ease-out; }
@keyframes welcome-pop { from { opacity: 0; transform: scale(0.7); } to { opacity: 1; transform: scale(1); } }

/* YTD mobile table */
.m-ytd-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #f1f5f9; }
.m-ytd-month { font-size: 13px; font-weight: 600; color: #334155; }
.m-ytd-total { font-size: 13px; font-weight: 700; color: #6366f1; }


.m-wrap{max-width:430px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(80px + env(safe-area-inset-bottom));}

     before anything else runs, means a working manifest exists from the
     very first paint. The later business/group-specific branding still
     applies on top of this once it loads -- this is just the baseline
     that guarantees "Install" always works, even if someone acts fast.
     Uses generateAppIcon() (defined further down, but hoisted since it's
     a function declaration) to produce real PNG icons at both 192 and
     512 -- Chrome's actual installability check specifically wants both
     sizes present; a single icon, or a non-PNG type declaration, can
     silently fail that check even though something displays fine. */
  function setupDefaultPWAManifest(){
    if(typeof generateAppIcon!=='function'||typeof SAAS_API_URL==='undefined'){setTimeout(setupDefaultPWAManifest,20);return;}
    // Icons for the browser tab / iOS home screen: fine to generate
    // instantly client-side, since those are read directly from the
    // page, not independently re-fetched by an external install service.
    generateAppIcon('Wagely',window.WAGELY_ICON,192,function(icon192){
      var appleIcon=document.getElementById('pwa-apple-icon');
      if(appleIcon)appleIcon.setAttribute('href',icon192);
      var fav192=document.getElementById('pwa-favicon-192');
      if(fav192)fav192.setAttribute('href',icon192);
      generateAppIcon('Wagely',window.WAGELY_ICON,32,function(icon32){
        var fav32=document.getElementById('pwa-favicon-32');
        if(fav32)fav32.setAttribute('href',icon32);
      });
    });
    // The manifest itself has to be a real URL Google's own servers can
    // independently fetch to actually build an installable app -- not a
    // blob: URL, which only ever exists inside this one browser tab and
    // is invisible to that separate, external install process. This is
    // exactly why installs were showing "Installing..." and then
    // producing nothing.
    var manifestLink=document.getElementById('pwa-manifest-link');
    if(manifestLink)manifestLink.setAttribute('href',SAAS_API_URL+'/api/manifest');
  }
  setupDefaultPWAManifest();
})();
</script>
</head>

<script>




/* ======================================================================
   CONFIGURATION & DATA
   (year/storage keys, sync endpoint, months, denominations, public
   holidays, department list, sample employee seed data)
   ====================================================================== */
var CY=new Date().getFullYear();
var ST=300;
/* ============================================================
   SAAS BACKEND CONFIG + MULTI-BUSINESS SUPPORT
   This file is shared by every customer -- ONE hosted copy. Each
   business still gets its own personal link (?key=...), and opening
   that link works exactly as before: no picker, no extra step,
   straight into that business.
   The registered-business list below is what enables one browser/
   device to hold MORE than one business at once (e.g. a customer who
   owns several businesses, or a shared office device) via an in-app
   switcher, without merging their data -- every piece of business-
   specific local storage (payroll cache, PIN, owner PIN, biometric
   credential) is namespaced by a hash of that business's own API key,
   so two businesses on the same device can never read or unlock each
   other's data. Dark mode and the "how this app works" dismissal stay
   device-wide on purpose -- they're not sensitive, and re-asking for
   them per business would just be annoying. */
var SAAS_API_URL='https://wagely-backend.onrender.com';
var BIZ_LIST_KEY='genlec_businesses'; // device-wide list of {key,label,logo}, safe to be global -- labels only, no payroll data or PINs live here
function bizHash(str){
  var h=0;
  for(var i=0;i<str.length;i++){h=((h<<5)-h+str.charCodeAt(i))|0;}
  return Math.abs(h).toString(36);
}
function getRegisteredBusinesses(){
  try{var raw=localStorage.getItem(BIZ_LIST_KEY);return raw?JSON.parse(raw):[];}catch(e){return [];}
}
function saveRegisteredBusinesses(list){
  try{localStorage.setItem(BIZ_LIST_KEY,JSON.stringify(list));}catch(e){}
}
function registerBusiness(key,label,logo){
  var list=getRegisteredBusinesses();
  var existing=list.find(function(b){return b.key===key;});
  if(existing){existing.label=label||existing.label;existing.logo=logo||existing.logo;}
  else list.push({key:key,label:label||'',logo:logo||''});
  saveRegisteredBusinesses(list);
}

var SAAS_API_KEY=(function(){
  var fromUrl=new URLSearchParams(window.location.search).get('key');
  if(fromUrl){try{localStorage.setItem('saas_api_key',fromUrl);}catch(e){}return fromUrl;}
  // No key in the URL: fall back to whichever single business is
  // registered on this device, resolved entirely in-memory (no reload
  // needed). If there's more than one, leave this blank -- the picker
  // screen (see renderBusinessPicker) takes over instead of the normal
  // app boot, and picking one there does a full reload with ?key= set,
  // which re-enters this same function on the fast, single-key path.
  var legacy=null;
  try{legacy=localStorage.getItem('saas_api_key');}catch(e){}
  var list=getRegisteredBusinesses();
  if(!list.length&&legacy){registerBusiness(legacy,'');list=getRegisteredBusinesses();}
  if(list.length===1)return list[0].key;
  return '';
})();
/* A group-owner login (see the "GROUP OWNER LOGIN" section further down)
   -- one key covering several businesses, e.g. a Polmaise owner who
   should see both Vakasha Lodge and Swaziland Boilers with a single PIN.
   Takes priority over everything above: if ?gkey= is present, the app
   shows the group PIN screen instead of any normal business boot, and
   picking a business from the resulting picker hands off to the exact
   same single-business flow as opening that business's own link. */
var GROUP_KEY=new URLSearchParams(window.location.search).get('gkey')||'';
if(GROUP_KEY)SAAS_API_KEY=''; // a group login always takes over from any single-business auto-resolve
/* When a business was reached via a group picker (not its own direct
   link), this remembers which group so "Switch business" in Settings
   can return to that group's picker instead of the plain device picker.
   Keyed per-business so it only applies to sessions that actually came
   from a group, not to a business opened directly some other time. */
function groupMarkerKey(apiKey){return 'genlec_group_for_'+bizHash(apiKey);}
function getGroupForCurrentBusiness(){
  if(!SAAS_API_KEY)return '';
  try{return localStorage.getItem(groupMarkerKey(SAAS_API_KEY))||'';}catch(e){return '';}
}
/* Namespace suffix for every piece of business-specific local storage.
   Derived from the API key itself (not a server round-trip) so it's
   available synchronously at boot, before any network call -- payroll
   data can still load from cache instantly offline, exactly as before. */
var BIZ_NS=SAAS_API_KEY?bizHash(SAAS_API_KEY):'';
function nsKey(base){return SAAS_API_KEY?base+'_'+BIZ_NS:base;}
var SK=nsKey('genlec_payroll_'+CY);
/* One-time migration: an existing single-business install had its data
   under the old, un-namespaced keys. Copy it forward the first time
   this runs under the new namespaced key, so nobody's existing PIN or
   payroll data appears to vanish. */
(function migrateLegacyStorage(){
  if(!SAAS_API_KEY)return;
  var pairs=[
    ['genlec_payroll_'+CY,SK],
    ['genlec_pin','genlec_pin_'+BIZ_NS],
    ['genlec_owner_pin','genlec_owner_pin_'+BIZ_NS],
    ['genlec_webauthn_cred','genlec_webauthn_cred_'+BIZ_NS],
  ];
  pairs.forEach(function(p){
    try{
      if(localStorage.getItem(p[0])!==null&&localStorage.getItem(p[1])===null){
        localStorage.setItem(p[1],localStorage.getItem(p[0]));
      }
    }catch(e){}
  });
})();
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var DENOMS=[200,100,50,20,10,5,2,1,0.50,0.20,0.10];
/* Public holidays, keyed by year then month index. This is only the SEED
   used the first time a year's data is created (see G.holidays below) --
   from then on, G.holidays is the live, editable, synced source of truth
   and this table is never read again. Fixed-date holidays (New Year's,
   King's Birthday, Flag Day, Worker's Day, King Sobhuza Memorial,
   Christmas, Boxing Day) repeat every year -- Ascension Day moves with
   Easter and needs checking/updating each year. Adding a new year's block
   here is optional (admins can now add/edit/remove holidays entirely from
   the Public Holidays tab), but seeding a fresh year with the known public
   holidays saves the admin re-typing them from scratch. */
var HOLS_BY_YEAR={
  2026:{
    0:[{d:'01 Jan',n:"New Year's Day"}],
    3:[{d:'19 Apr',n:'King Mswati III Birthday'},{d:'25 Apr',n:'National Flag Day'}],
    4:[{d:'01 May',n:"Worker's Day"},{d:'14 May',n:'Ascension Day'}],
    6:[{d:'22 Jul',n:'King Sobhuza II Memorial Day'}],
    11:[{d:'25 Dec',n:'Christmas Day'},{d:'26 Dec',n:'Boxing Day'}]
  }
};
var COLS=['av-blue','av-teal','av-coral','av-purple'];
var BANK_TYPES=['FNB','Standard Bank','Eswatini Bank','NedBank','Other'];
var DEPT_OPTIONS=[['GROUNDS','Grounds'],['RESTAURANT','Restaurant'],['HOUSEKEEPING','Housekeeping'],['RECEPTION','Reception'],['SECURITY','Security'],['KITCHEN','Kitchen'],['MANAGEMENT','Management'],['TEMPORARY','Temporary'],['OTHER','Other']];
/* Shared <option> builders so the add/edit employee form (which is hand-laid-out
   twice -- once for the desktop modal, once for the mobile sheet, since they use
   different wrapper markup/classes) doesn't also duplicate these three option
   lists. One source of truth for what a bank type, department, or avatar
   colour can be. */
function avatarColorOptionsHtml(e){return COLS.map(function(c){return'<option value="'+c+'"'+(e.col===c?' selected':'')+'>'+c.replace('av-','')+'</option>';}).join('');}
function bankTypeOptionsHtml(e){return BANK_TYPES.map(function(b){return'<option value="'+b+'"'+((e.bank||'')===b?' selected':'')+'>'+b+'</option>';}).join('');}
function deptOptionsHtml(e){return DEPT_OPTIONS.map(function(d){return'<option value="'+d[0]+'"'+((e.dept||'OTHER').toUpperCase()===d[0]?' selected':'')+'>'+d[1]+'</option>';}).join('');}
/* Same idea for the personal & banking details rows shown on an employee's
   profile page -- identical 8 fields, identical order, previously typed out
   as two separate literal arrays (desktop + mobile). */
function personalDetailRows(emp){
  var ageStr=dobToAge(emp.dob);
  var bdayStr=birthdayText(emp.dob);
  return [
    ['ID number',emp.idNo||'--'],
    ['Date of birth',(emp.dob||'--')+(ageStr!==null?' ('+ageStr+' yrs)':'')],
    ['Next birthday',bdayStr||'--'],
    ['Department',emp.dept||'Other'],
    ['WhatsApp number',emp.phone||'--'],
    ['Bank',emp.bank||'--'],
    ['Account number',emp.accNo||'--'],
    ['Status',emp.active?'Active':'Deactivated']
  ];
}
/* Single source of truth for a payslip's numbers, consumed by every place
   that renders or prints one (screen payslip, printable payslip, the
   employee portal, and the swipe-card preview) instead of each re-deriving
   the same nine values independently. */
function payslipCalc(emp,mo){
  var p=po(emp,mo);
  return {
    p:p,d:den(p),sal:es(emp,mo),adv:getAdv(emp,mo),hol:getHol(emp,mo),
    otH:getOTHours(emp,mo),otAmt:getOTAmount(emp,mo),
    dedTot:getDeductionsTotal(emp),allowTot:getAllowancesTotal(emp)
  };
}
/* SECURITY NOTE: this seed list only exists so a brand-new device (no local
   data yet, no cloud data yet) has something to look at. It intentionally
   contains no real names, ID numbers, salaries or bank details -- real staff
   data must only ever live in localStorage / the synced cloud store, never in
   source code, since this file ships in plain text to every visitor and sits
   in the repo history. Once real employees are added through the app UI on
   your device, this array is never read again. */
var DEF=[
  {id:1,name:'Sample Employee 1',ini:'S1',col:'av-blue',sal:0,paye:0,enpf:0,notes:'',idNo:'',bank:'',accNo:'',dept:'Other',active:true,wn:[],ov:{},advPerMonth:{},holPerMonth:{},leaveEntitlement:14,leavePerMonth:{},phone:'',otRate:0,otPerMonth:{},deductions:[],allowances:[],salaryHistory:[],sickEntitlement:14,sickPerMonth:{},familyEntitlement:2,familyPerMonth:{},dob:'',pin:'',pinChanged:false,ackLog:{}},
  {id:2,name:'Sample Employee 2',ini:'S2',col:'av-teal',sal:0,paye:0,enpf:0,notes:'',idNo:'',bank:'',accNo:'',dept:'Other',active:true,wn:[],ov:{},advPerMonth:{},holPerMonth:{},leaveEntitlement:14,leavePerMonth:{},phone:'',otRate:0,otPerMonth:{},deductions:[],allowances:[],salaryHistory:[],sickEntitlement:14,sickPerMonth:{},familyEntitlement:2,familyPerMonth:{},dob:'',pin:'',pinChanged:false,ackLog:{}}
];
/* ======================================================================
   STATE, PERSISTENCE & YEAR ROLLOVER
   (load/save to localStorage, the G global app-state object, and the
   new-calendar-year employee carry-forward flow)
   ====================================================================== */
var syncTimer=null,syncStatus='',lastActive=Date.now();
var pinEntry='',pinLocked=false,pinLockUntil=0,pinAttempts=0;
var localSaveFailed=false;
var lastSyncedUpdatedAt=0;
function loadS(){try{var r=localStorage.getItem(SK);if(r)return JSON.parse(r);}catch(e){return null;}return null;}
var readOnlyNoticeShowing=false;
function showReadOnlyBlockedNotice(){
  if(readOnlyNoticeShowing)return; // avoid stacking alerts if several blocked saves fire in quick succession
  readOnlyNoticeShowing=true;
  showAlert('You\'re viewing '+(G.businessName||'this business')+' in read-only mode. Changes need to be made by their own manager, using their own PIN.',function(){readOnlyNoticeShowing=false;});
}
/* Shown as a persistent strip at the very top of every screen while
   viewing a business in read-only mode via the group session -- added
   once as a fixed element outside #root (rather than woven into each
   individual screen's own header markup) so it can't be missed on any
   particular tab or view, and survives every render() call without
   needing to be threaded through every screen that has its own header. */
function renderReadOnlyBanner(){
  var existing=document.getElementById('read-only-banner');
  if(!(G.authed&&G.groupReadOnly)){
    if(existing)existing.remove();
    return;
  }
  var text='READ-ONLY -- viewing '+(G.businessName||'this business')+"'s live payroll. Changes are made by their own manager.";
  if(existing){existing.textContent=text;return;} // update in place -- businessName may only arrive after the first render
  var el=document.createElement('div');
  el.id='read-only-banner';
  el.style.cssText='position:fixed;top:0;left:0;right:0;z-index:9990;background:#1A1F26;color:#E4CD98;font-size:11.5px;font-weight:700;text-align:center;padding:7px 12px;letter-spacing:.02em;';
  el.textContent=text;
  document.body.appendChild(el);
}
function saveS(allowDespiteReadOnly){
  if(G.groupReadOnly&&!allowDespiteReadOnly){
    /* Safety-critical: this is the single choke point every data
       mutation in the app passes through before persisting, whether
       local or cloud. Refusing to write here guarantees a read-only
       group session can never actually change this business's data,
       even if some UI trigger elsewhere wasn't caught by the specific
       buttons hidden for this mode. render() still reflects it as a
       genuine failure, not a silent no-op, so it's never misleading.
       The one deliberate exception is approveGroupRequest(), which
       passes allowDespiteReadOnly=true -- approving is an owner
       prerogative independent of whether they can edit this business's
       payroll details, so it's the one narrow, explicit carve-out from
       this guard rather than a general loosening of it. */
    showReadOnlyBlockedNotice();
    return;
  }
  G.updatedAt=Date.now();
  try{
    localStorage.setItem(SK,JSON.stringify({emps:G.emps,paid:G.paid,prepared:G.prepared,groupApprovalRequested:G.groupApprovalRequested,groupApproved:G.groupApproved,log:G.log,mo:G.mo,updatedAt:G.updatedAt,holidays:G.holidays}));
    localSaveFailed=false;
  }catch(e){
    localSaveFailed=true;
    syncStatus='localerror';renderSyncBadge();
  }
  clearTimeout(syncTimer);syncStatus='saving';
  syncTimer=setTimeout(function(){syncToCloud();},1500);
}
var sv=loadS();
function findPrevYearData(){
  var years=[];
  try{
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      var mm=k&&k.match(/^genlec_payroll_(\d{4})$/);
      if(mm){var yr=parseInt(mm[1],10);if(yr<CY)years.push(yr);}
    }
  }catch(e){}
  if(!years.length)return null;
  years.sort(function(a,b){return b-a;});
  return years[0];
}
function loadYearBlob(year){
  try{var r=localStorage.getItem(nsKey('genlec_payroll_'+year));if(r)return JSON.parse(r);}catch(e){}
  return null;
}
/* If this calendar year has never been saved locally, but an earlier year
   has data, offer to carry the employee list forward instead of silently
   falling back to the blank sample employees. See rolloverFromYear(). */
var ROLLOVER_PREV_YEAR=(!sv)?findPrevYearData():null;
/* Factory, not a one-time literal -- switching business in-place (see
   switchToBusinessInPlace() near the bottom of the file) needs to
   rebuild a completely fresh G for the new business's own SK/localStorage
   namespace, without any risk of a stale field from the previous
   business's G surviving the switch. Every call site that used to read
   the old inline object literal now calls this instead. */
function freshG(sv,rolloverPrevYear){
  return {
    mo:sv&&sv.mo!==undefined?sv.mo:new Date().getMonth(),
    emps:sv&&sv.emps?sv.emps:JSON.parse(JSON.stringify(DEF)),
    paid:sv&&sv.paid?sv.paid:{},
    prepared:sv&&sv.prepared?sv.prepared:{},
    groupApprovalRequested:sv&&sv.groupApprovalRequested?sv.groupApprovalRequested:{},
    groupApproved:sv&&sv.groupApproved?sv.groupApproved:{},
    log:sv&&sv.log?sv.log:[],
    updatedAt:sv&&sv.updatedAt?sv.updatedAt:Date.now(),
    holidays:sv&&sv.holidays?sv.holidays:(function(){var seed={};seed[CY]=JSON.parse(JSON.stringify(HOLS_BY_YEAR[CY]||{}));return seed;})(),
    holYear:CY,
    authed:false,tab:'monthly',modal:null,sp:null,sn:{},profile:null,staffFilter:'',payrollFilter:'',
    rolloverHandled:!rolloverPrevYear,
    role:null,
    showBankCols:false,
    portalMode:false,portalAuthed:false,portalEmpId:null,portalMonth:null,portalNeedsPinSetup:false,
    holEdit:null,
    features:{employee_portal:true,custom_holidays:true,multi_year_holidays:true,whatsapp_payslips:true,csv_export:true,ytd_tab:true,cash_denominations:true,audit_log:true,biometric_unlock:true},
    planLabel:'',
    businessName:''
  };
}
var G=freshG(sv,ROLLOVER_PREV_YEAR);
/* Employee self-service portal: separate from the owner/preparer PIN lock
   above. An employee signs in with a personal 4-digit PIN only (management
   assigns the initial PIN on their employee record; the PIN alone must
   identify them, so it's enforced unique across active staff). On first
   login they're required to replace the admin-assigned PIN with one only
   they know, before they can see anything -- tracked via emp.pinChanged,
   which is reset to false any time an admin (re)sets the PIN.
   Like the rest of this app's "auth", this check runs entirely in the
   browser after the full payroll dataset has already loaded, because there
   is no separate backend login endpoint -- it deters casual access rather
   than being cryptographically secure. Keep employee PINs distinct from
   the owner PIN for that reason. */
var portalPinEntry='',portalLoginErr=false;
var portalPinLocked=false,portalPinLockUntil=0,portalPinAttempts=0;
var portalNewPinStep='enter',portalNewPinEntry='',portalNewPinConfirmEntry='',portalNewPinErr=false;
/* Shared with the owner/preparer PIN screens' visual language (same .pin-dot
   / .pin-btn / .pin-pad classes) so every PIN-entry moment in the app looks
   and behaves the same way, whether it's the owner unlocking the whole app
   or an employee unlocking their own payslip. */
function pinPadHtml(digitFn){
  var nums=['1','2','3','4','5','6','7','8','9','','0','del'];
  return nums.map(function(n){
    if(n==='')return'<div></div>';
    if(n==='del')return'<button class="pin-btn" style="font-size:14px;" onclick="'+digitFn+'(\'del\')">&#9003;</button>';
    return'<button class="pin-btn" onclick="'+digitFn+'(\''+n+'\')">'+n+'</button>';
  }).join('');
}
function pinDotsHtml(len){var d='';for(var i=0;i<4;i++)d+='<div class="pin-dot'+(i<len?' filled':'')+'"></div>';return d;}
function mPinPadHtml(digitFn){
  var nums=['1','2','3','4','5','6','7','8','9','','0','del'];
  return nums.map(function(n){
    if(n==='')return'<div></div>';
    if(n==='del')return'<button class="m-pin-btn" onclick="'+digitFn+'(\'del\')">&#9003;</button>';
    return'<button class="m-pin-btn" onclick="'+digitFn+'(\''+n+'\')">'+n+'</button>';
  }).join('');
}
function mPinDotsHtml(len){var d='';for(var i=0;i<4;i++)d+='<div class="m-pin-dot'+(i<len?' filled':'')+'"></div>';return d;}
lastSyncedUpdatedAt=G.updatedAt;
function mergeForwardHolidays(blob){
  /* Public holidays are forward-looking planning data, independent of
     whether the admin chooses to carry the employee list forward or start
     fresh -- if holidays were pre-entered for this year (or beyond) while
     still operating in the previous year's blob, that's exactly the data
     this rollover moment needs to surface, not discard. */
  if(!blob||!blob.holidays)return;
  Object.keys(blob.holidays).forEach(function(yrKey){
    var yr=parseInt(yrKey,10);
    if(yr>=CY&&blob.holidays[yrKey]&&Object.keys(blob.holidays[yrKey]).length){
      if(!G.holidays)G.holidays={};
      G.holidays[yr]=blob.holidays[yrKey];
    }
  });
}
function rolloverFromYear(year){
  var blob=loadYearBlob(year);
  if(!blob||!blob.emps||!blob.emps.length){ROLLOVER_PREV_YEAR=null;G.rolloverHandled=true;render();return;}
  var newEmps=blob.emps.map(function(e){
    return {
      id:e.id,name:e.name,ini:e.ini,col:e.col,sal:e.sal,paye:e.paye,enpf:e.enpf,
      notes:e.notes,idNo:e.idNo,bank:e.bank,accNo:e.accNo,dept:e.dept,active:e.active,
      phone:e.phone||'',otRate:e.otRate||0,
      leaveEntitlement:e.leaveEntitlement!==undefined?e.leaveEntitlement:14,
      deductions:(e.deductions||[]).map(function(d){return{id:d.id,label:d.label,amount:d.amount,active:d.active};}),
      allowances:(e.allowances||[]).map(function(d){return{id:d.id,label:d.label,amount:d.amount,active:d.active};}),
      salaryHistory:(e.salaryHistory||[]).slice(),
      dob:e.dob||'',
      pin:e.pin||'',pinChanged:!!e.pinChanged,
      wn:[],ov:{},advPerMonth:{},holPerMonth:{},leavePerMonth:{},otPerMonth:{},ackLog:{}
    };
  });
  G.emps=newEmps;G.paid={};G.prepared={};G.mo=0;
  mergeForwardHolidays(blob);
  G.log=[{ts:nowTs(),msg:'Rolled over from '+year+' - employee list carried forward, all monthly figures reset for '+CY+'.'}];
  ROLLOVER_PREV_YEAR=null;G.rolloverHandled=true;

function migrateEmpFields(){
  var changed=false;
  (G.emps||[]).forEach(function(e){
    {
      if(e.idNo===undefined){e.idNo='';changed=true;}
      if(e.bank===undefined){e.bank='';changed=true;}
      if(e.accNo===undefined){e.accNo='';changed=true;}
      if(e.dept===undefined){e.dept='Other';changed=true;}
    }
    if(!e.holPerMonth){e.holPerMonth={};changed=true;}
    if(e.leaveEntitlement===undefined){e.leaveEntitlement=14;changed=true;}
    if(!e.leavePerMonth){e.leavePerMonth={};changed=true;}
    if(e.sickEntitlement===undefined){e.sickEntitlement=14;changed=true;}
    if(!e.sickPerMonth){e.sickPerMonth={};changed=true;}
    if(e.familyEntitlement===undefined){e.familyEntitlement=2;changed=true;}
    if(!e.familyPerMonth){e.familyPerMonth={};changed=true;}
    if(e.phone===undefined){e.phone='';changed=true;}
    if(e.dob===undefined){e.dob='';changed=true;}
    if(!e.dob&&e.idNo){
      var guessedDob=idNoToDob(e.idNo);
      if(guessedDob){e.dob=guessedDob;changed=true;}
    }
    if(e.otRate===undefined){e.otRate=Math.round((dailyRate(e)/8*1.5)*100)/100;changed=true;}
    if(!e.otPerMonth){e.otPerMonth={};changed=true;}
    if(!e.deductions){e.deductions=[];changed=true;}
    if(!e.allowances){e.allowances=[];changed=true;}
    if(!e.salaryHistory){e.salaryHistory=[];changed=true;}
    if(e.pin===undefined){e.pin='';changed=true;}
    if(e.pinChanged===undefined){e.pinChanged=false;changed=true;}
    if(!e.ackLog){e.ackLog={};changed=true;}
  });
  /* Self-heal any PIN collision that predates the uniqueness checks above
     (e.g. data from before this feature enforced it, or two employees
     coincidentally assigned the same PIN). An ambiguous PIN would log
     someone into the wrong profile, or into the admin app entirely, so any
     collision found here is cleared rather than left in place -- first
     employee (by list order) keeps it, everyone else colliding with it or
     with the owner/preparer PIN gets theirs reset and logged for the admin
     to reassign. */
  var seenPins={};
  (G.emps||[]).forEach(function(e){
    if(e.active&&e.pin){
      if(pinCollidesWithAdmin(e.pin)||seenPins[e.pin]){
        G.log.push({ts:nowTs(),msg:'Portal PIN for '+e.name+' was cleared automatically (it collided with another PIN and could have logged them into the wrong profile) - please reassign it.'});
        e.pin='';e.pinChanged=false;changed=true;
      }else{
        seenPins[e.pin]=true;
      }
    }
  });
  if(changed&&!G.groupReadOnly)saveS();
}
function migrateHolidaysStructure(){
  /* The first version of the editable public-holidays feature stored
     G.holidays flat, keyed directly by month index (0-11) for the current
     year only -- there was no way to plan a future year's holidays ahead
     of time. This upgrades that to year-keyed (G.holidays[year][month])
     so any year can hold data, without losing whatever was already saved
     under the old flat shape. Detection: a legit year-keyed object has
     4-digit year keys; the old flat shape only ever had keys 0-11. */
  if(!G.holidays)G.holidays={};
  var keys=Object.keys(G.holidays);
  var looksFlat=keys.length>0&&keys.every(function(k){var n=parseInt(k,10);return n>=0&&n<=11;});
  if(looksFlat){
    var wrapped={};wrapped[CY]=G.holidays;
    G.holidays=wrapped;
    G.log.push({ts:nowTs(),msg:'Upgraded the public holiday calendar to support future years - your existing '+CY+' holidays were carried forward.'});
    if(!G.groupReadOnly)saveS();
  }
  if(!G.holidays[CY])G.holidays[CY]=JSON.parse(JSON.stringify(HOLS_BY_YEAR[CY]||{}));
  if(!G.holYear)G.holYear=CY;
}

function syncToCloud(cb){
  if(!navigator.onLine){syncStatus='offline';renderSyncBadge();if(cb)cb(false);return;}
  syncStatus='saving';renderSyncBadge();
  fetch(SAAS_API_URL+'/api/data',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':SAAS_API_KEY},
    body:JSON.stringify({blob:{emps:G.emps,paid:G.paid,prepared:G.prepared,groupApprovalRequested:G.groupApprovalRequested,groupApproved:G.groupApproved,log:G.log,mo:G.mo,updatedAt:G.updatedAt,holidays:G.holidays}})
  })
    .then(function(r){if(r.status===403){subscriptionBlocked=true;}return r.json();})
    .then(function(d){
      var ok=!!d.ok;
      syncStatus=ok?'saved':'error';renderSyncBadge();
      if(ok)lastSyncedUpdatedAt=G.updatedAt;
      if(cb)cb(ok);
    })
    .catch(function(){syncStatus='error';renderSyncBadge();if(cb)cb(false);});
}
function loadFromCloud(cb){
  if(!navigator.onLine){if(cb)cb(false);return;}
  syncStatus='loading';renderSyncBadge();
  fetch(SAAS_API_URL+'/api/data',{headers:{'x-api-key':SAAS_API_KEY}})
    .then(function(r){if(r.status===403){subscriptionBlocked=true;}return r.json();})
    .then(function(resp){
      var d=resp&&resp.blob;
      if(!d||!d.emps||!d.emps.length){syncStatus='saved';renderSyncBadge();if(cb)cb(false);return;}
      {
        var remoteTs=resp.updated_at||d.updatedAt||0;
        var localHasUnsyncedEdits=G.updatedAt>lastSyncedUpdatedAt;
        var remoteIsNewerThanLocal=remoteTs>G.updatedAt;
        function applyRemoteData(){
          G.emps=d.emps;if(d.paid)G.paid=d.paid;if(d.prepared)G.prepared=d.prepared;if(d.groupApprovalRequested)G.groupApprovalRequested=d.groupApprovalRequested;if(d.groupApproved)G.groupApproved=d.groupApproved;if(d.log)G.log=d.log;if(d.mo!==undefined)G.mo=d.mo;if(d.holidays)G.holidays=d.holidays;
          G.updatedAt=remoteTs||Date.now();
          lastSyncedUpdatedAt=G.updatedAt;
          migrateEmpFields();
          migrateHolidaysStructure();
          try{localStorage.setItem(SK,JSON.stringify({emps:G.emps,paid:G.paid,prepared:G.prepared,groupApprovalRequested:G.groupApprovalRequested,groupApproved:G.groupApproved,log:G.log,mo:G.mo,updatedAt:G.updatedAt,holidays:G.holidays}));localSaveFailed=false;}
          catch(e){localSaveFailed=true;}
          syncStatus='saved';renderSyncBadge();if(cb)cb(true);
        }
        if(localHasUnsyncedEdits&&remoteIsNewerThanLocal){
          showConfirm('This device has unsaved local changes, and the cloud copy is newer than what you last synced.\n\nPress OK to load the cloud version (your local changes will be discarded).\nPress Cancel to keep this device\'s version -- use "Force sync now" afterwards to push it to the cloud.',
            applyRemoteData,
            function(){syncStatus='saved';renderSyncBadge();if(cb)cb(false);}
          );
        }else{
          applyRemoteData();
        }
      }
    }).catch(function(){syncStatus='error';renderSyncBadge();if(cb)cb(false);});
}
/* ============================================================
   PER-CUSTOMER "ADD TO HOME SCREEN" BRANDING
   Every customer runs the exact same HTML file, so the app name and
   icon that show up when someone taps "Add to Home Screen" can't be
   baked into the file statically -- they're generated here, in the
   browser, from this tenant's business name and logo, and swapped
   into the <head> the moment those values load. iOS reads
   apple-mobile-web-app-title / apple-touch-icon directly from the
   DOM at the moment "Add to Home Screen" is tapped (no fetch
   involved); Android/Chrome reads whatever the <link rel="manifest">
   currently points to, which is why the manifest itself is generated
   as an in-memory Blob and swapped in the same way, rather than
   requiring a real manifest.json file per customer.
   ============================================================ */
var ICON_COLORS=['#0E4B43','#8A6D3B','#5B4A72','#2E5C8A','#8A3B2E','#3B6E5C'];
function pickIconColor(name){
  var s=name||'W';var h=0;
  for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;
  return ICON_COLORS[h%ICON_COLORS.length];
}
function initialsFor(name){
  var words=(name||'Wages').trim().split(/\s+/).filter(Boolean);
  if(!words.length)return'W';
  if(words.length===1)return words[0].slice(0,2).toUpperCase();
  return(words[0][0]+words[1][0]).toUpperCase();
}
/* Builds a square home-screen icon at the given size. If this tenant has
   a logo, it's centered on a plain white square with padding (so a
   rectangular or oddly-cropped source logo still reads as a clean app
   icon rather than looking stretched or cut off). If they don't have a
   logo -- explicitly the common case, not an edge case, since not every
   customer will have one -- falls back to the same colored-initials
   treatment already used for employee avatars elsewhere in this app, so
   it looks like a deliberate design choice rather than a missing image. */
function generateAppIcon(businessName,logoUri,size,cb){
  var canvas=document.createElement('canvas');
  canvas.width=size;canvas.height=size;
  var ctx=canvas.getContext('2d');
  if(logoUri){
    var img=new Image();
    img.onload=function(){
      ctx.fillStyle='#ffffff';ctx.fillRect(0,0,size,size);
      var pad=size*0.14;
      var maxW=size-pad*2,maxH=size-pad*2;
      var scale=Math.min(maxW/img.width,maxH/img.height,1);
      var w=img.width*scale,h=img.height*scale;
      ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);
      cb(canvas.toDataURL('image/png'));
    };
    img.onerror=function(){cb(generateInitialsIcon(businessName,size));};
    img.src=logoUri;
  }else{
    cb(generateInitialsIcon(businessName,size));
  }
}
function generateInitialsIcon(businessName,size){
  var canvas=document.createElement('canvas');
  canvas.width=size;canvas.height=size;
  var ctx=canvas.getContext('2d');
  ctx.fillStyle=pickIconColor(businessName);
  ctx.fillRect(0,0,size,size);
  ctx.fillStyle='#ffffff';
  ctx.font='700 '+Math.round(size*0.42)+'px -apple-system,Arial,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(initialsFor(businessName),size/2,size/2+size*0.02);
  return canvas.toDataURL('image/png');
}
var pwaManifestBlobUrl=null;
function applyPWABranding(){
  var name=(G.businessName||'').trim();
  var appLabel=(name?name+' Wages':'Wagely');
  document.title=appLabel;
  var appleTitle=document.getElementById('pwa-apple-title');
  if(appleTitle)appleTitle.setAttribute('content',appLabel);

  // Apple touch icon / favicon: generated instantly client-side (data
  // URIs) is fine here -- iOS reads these directly from the page at the
  // moment "Add to Home Screen" is tapped, no separate server-side fetch
  // involved the way Android's real install process needs.
  generateAppIcon(name,window.LOGO_DATA,192,function(icon192){
    var appleIcon=document.getElementById('pwa-apple-icon');
    if(appleIcon)appleIcon.setAttribute('href',icon192);
    var fav192=document.getElementById('pwa-favicon-192');
    if(fav192)fav192.setAttribute('href',icon192);
    generateAppIcon(name,window.LOGO_DATA,32,function(icon32){
      var fav32=document.getElementById('pwa-favicon-32');
      if(fav32)fav32.setAttribute('href',icon32);
    });
  });

  // The manifest itself, though, has to be a real, permanently-fetchable
  // URL -- Android's actual install process (as opposed to just the
  // "want to install?" prompt) happens via Google's own servers
  // independently re-fetching this, which a client-generated blob: URL
  // is invisible to outside this one browser tab.
  var manifestLink=document.getElementById('pwa-manifest-link');
  if(manifestLink&&SAAS_API_KEY)manifestLink.setAttribute('href',SAAS_API_URL+'/api/manifest?key='+encodeURIComponent(SAAS_API_KEY));
}
/* ============================================================
   SAAS ENTITLEMENTS
   Called once after PIN unlock. Confirms this customer's
   subscription is active and fetches which features their plan
   (plus any per-customer overrides set in the back office) actually
   includes. G.features drives the UI-level show/hide gating
   throughout the app. Losing connectivity here doesn't lock a
   customer out of their own already-synced local data -- it just
   means they're working from the last-known feature set until the
   next successful check. */
var subscriptionBlocked=false;
var subscriptionBlockedMsg='';
function validateSubscription(cb){
  if(!SAAS_API_KEY){
    subscriptionBlocked=true;
    if(cb)cb(false,'This link is missing your access code. Please use the personal link your provider sent you, not a bookmark of the bare address.');
    return;
  }
  if(!navigator.onLine){if(cb)cb(true);return;} // offline: proceed with cached G.features
  fetch(SAAS_API_URL+'/api/auth/validate',{method:'POST',headers:{'x-api-key':SAAS_API_KEY}})
    .then(function(r){
      if(r.status===401||r.status===403){subscriptionBlocked=true;return r.json().then(function(d){throw new Error(d.error||'Subscription not active');});}
      if(!r.ok){subscriptionBlocked=true;throw new Error('The server at '+SAAS_API_URL+' responded unexpectedly (status '+r.status+'). It may be misconfigured or temporarily down.');}
      return r.json();
    })
    .then(function(d){
      G.features=d.features||{};
      G.planLabel=d.plan_label||d.plan||'';
      G.businessName=d.business_name||'';
      window.LOGO_DATA=d.logo||'';
      G.groupApproval=d.group_approval||null;
      registerBusiness(SAAS_API_KEY,G.businessName,window.LOGO_DATA);
      applyPWABranding();
      subscriptionBlocked=false;
      if(G.tab==='ytd'&&!G.features.ytd_tab)G.tab='monthly';
      if(G.tab==='holidays'&&!G.features.custom_holidays)G.tab='monthly';
      if(G.tab==='audit'&&!G.features.audit_log)G.tab='monthly';
      if(cb)cb(true);
    })
    .catch(function(err){
      subscriptionBlocked=true;
      // Distinguish "reached the backend, it rejected this key" from
      // "never reached the backend at all" -- a bare fetch failure
      // (network error, wrong URL, CORS, backend down) throws a generic
      // browser TypeError with no useful message of its own, so that
      // case gets a clearer explanation pointing at SAAS_API_URL instead
      // of just showing "Failed to fetch".
      var isNetworkFailure=(err instanceof TypeError);
      var msg=isNetworkFailure
        ?('Could not reach the backend at '+SAAS_API_URL+'. Check that this URL is correct and the backend is running.')
        :err.message;
      if(cb)cb(false,msg);
    });
}

/* ======================================================================
   PUBLIC HOLIDAYS
   (editable calendar, replaces the old hardcoded-in-source-code list --
   admins can now correct a date, rename one, or add a company-specific
   holiday entirely from the Public Holidays tab)
   ====================================================================== */
function addOrUpdateHoliday(){
  var dateEl=document.getElementById('hol-date');
  var nameEl=document.getElementById('hol-name');
  if(!dateEl||!nameEl)return;
  var dateVal=dateEl.value,name=nameEl.value.trim();
  if(!dateVal||!name){showAlert('Enter both a date and a holiday name.');return;}
  var dt=new Date(dateVal+'T00:00:00');
  if(isNaN(dt.getTime())){showAlert('That date doesn\'t look valid.');return;}
  var yr=dt.getFullYear(),mi=dt.getMonth();
  var dayStr=String(dt.getDate()).padStart(2,'0')+' '+MONTHS[mi].slice(0,3);
  if(!G.holidays)G.holidays={};
  if(!G.holidays[yr])G.holidays[yr]={};
  if(!G.holidays[yr][mi])G.holidays[yr][mi]=[];
  if(G.holEdit){
    var from=G.holEdit;
    if(from.yr===yr&&from.mi===mi){
      G.holidays[yr][mi][from.idx]={d:dayStr,n:name};
    }else{
      if(G.holidays[from.yr]&&G.holidays[from.yr][from.mi])G.holidays[from.yr][from.mi].splice(from.idx,1);
      G.holidays[yr][mi].push({d:dayStr,n:name});
    }
    G.log.push({ts:nowTs(),msg:'Updated public holiday: '+dayStr+' '+yr+' - '+name});
  }else{
    G.holidays[yr][mi].push({d:dayStr,n:name});
    G.log.push({ts:nowTs(),msg:'Added public holiday: '+dayStr+' '+yr+' - '+name});
  }
  G.holidays[yr][mi].sort(function(a,b){return parseInt(a.d)-parseInt(b.d);});
  G.holEdit=null;
  G.holYear=yr;
  saveS();render();
}
function editHoliday(yr,mi,idx){
  var h=G.holidays&&G.holidays[yr]&&G.holidays[yr][mi]&&G.holidays[yr][mi][idx];
  if(!h)return;
  G.holEdit={yr:yr,mi:mi,idx:idx};
  render();
  var dateEl=document.getElementById('hol-date');
  if(dateEl){
    var dayNum=parseInt(h.d);
    dateEl.value=yr+'-'+String(mi+1).padStart(2,'0')+'-'+String(dayNum).padStart(2,'0');
  }
  var nameEl=document.getElementById('hol-name');
  if(nameEl)nameEl.value=h.n;
  var formEl=document.getElementById('hol-form');
  if(formEl)formEl.scrollIntoView({behavior:'smooth',block:'center'});
}
function cancelHolEdit(){G.holEdit=null;render();}
function deleteHoliday(yr,mi,idx){
  var h=G.holidays&&G.holidays[yr]&&G.holidays[yr][mi]&&G.holidays[yr][mi][idx];
  if(!h)return;
  showConfirm('Remove "'+h.n+'" ('+h.d+' '+yr+') from the public holiday calendar?',function(){
    G.holidays[yr][mi].splice(idx,1);
    G.log.push({ts:nowTs(),msg:'Removed public holiday: '+h.d+' '+yr+' - '+h.n});
    if(G.holEdit&&G.holEdit.yr===yr&&G.holEdit.mi===mi&&G.holEdit.idx===idx)G.holEdit=null;
    haptic(30);saveS();render();
  });
}

var sortCol=null,sortDir=1;
function sortBy(col){
  if(sortCol===col)sortDir*=-1;
  else{sortCol=col;sortDir=1;}
  render();
}
function getSortedEmps(){
  var emps=G.emps.slice();
  if(!sortCol)return emps;
  emps.sort(function(a,b){
    var av,bv;
    if(sortCol==='name'){av=a.name.toLowerCase();bv=b.name.toLowerCase();}
    else if(sortCol==='payout'){av=po(a,G.mo);bv=po(b,G.mo);}
    else if(sortCol==='salary'){av=es(a,G.mo);bv=es(b,G.mo);}
    if(av<bv)return -1*sortDir;
    if(av>bv)return 1*sortDir;
    return 0;
  });
  return emps;
}

function exportBackup(){

    mo:G.mo,

  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  var date=new Date().toISOString().slice(0,10);
  a.href=url;
  a.download='vakasha-lodge-wages-backup-'+date+'.json';
  document.body.appendChild(a);

function importBackup(){
  var input=document.createElement('input');
  input.type='file';
  input.accept='.json';
  input.onchange=function(e){
    var file=e.target.files[0];
    if(!file)return;
    var reader=new FileReader();
    reader.onload=function(ev){
      try{
        var data=JSON.parse(ev.target.result);
        if(!data.emps||!Array.isArray(data.emps)){
          showAlert('Invalid backup file.');return;
        }
        showConfirm('Replace ALL current data with this backup from '+(data.exported||'unknown date')+'? This cannot be undone.',function(){
          G.emps=data.emps;
          G.paid=data.paid||{};
          G.log=data.log||[];
          G.mo=data.mo!==undefined?data.mo:G.mo;
          if(data.holidays)G.holidays=data.holidays;
          migrateEmpFields();
          migrateHolidaysStructure();
          G.log.push({ts:nowTs(),msg:'Data restored from backup ('+( data.exported||'unknown')+').'});
          saveS();
          syncToCloud();
          render();
          showAlert('Backup restored successfully.');
        });
      }catch(err){
        showAlert('Failed to read backup file: '+err.message);
      }
    };
    reader.readAsText(file);
  };
  document.body.appendChild(input);
  input.click();
  document.body.removeChild(input);
}

function dobToAge(dob){
  var m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(dob||'');
  if(!m)return null;
  var d=parseInt(m[1],10),mo=parseInt(m[2],10)-1,y=parseInt(m[3],10);
  var birth=new Date(y,mo,d);
  if(isNaN(birth.getTime()))return null;
  var today=new Date();
  var age=today.getFullYear()-y;
  if(today.getMonth()<mo||(today.getMonth()===mo&&today.getDate()<d))age--;
  return age;
}
/* Eswatini/SA-style national ID numbers start with a YYMMDD birthdate.
   The two-digit year is genuinely ambiguous (90 could be 1990 or 2090) --
   for a workforce, assuming anyone whose two-digit year isn't yet greater
   than the current two-digit year was born in the 2000s, and everyone
   else in the 1900s, correctly covers every realistic working age. */
function idNoToDob(idNo){
  var digits=String(idNo||'').replace(/[^0-9]/g,'');
  if(digits.length<6)return null;
  var yy=parseInt(digits.slice(0,2),10);
  var mm=parseInt(digits.slice(2,4),10);
  var dd=parseInt(digits.slice(4,6),10);
  if(mm<1||mm>12||dd<1||dd>31)return null;
  var curYY=new Date().getFullYear()%100;
  var fullYear=(yy<=curYY?2000:1900)+yy;
  var check=new Date(fullYear,mm-1,dd);
  if(isNaN(check.getTime())||check.getMonth()!==mm-1||check.getDate()!==dd)return null;
  return String(dd).padStart(2,'0')+'/'+String(mm).padStart(2,'0')+'/'+fullYear;
}

function nextBirthday(dob){
  var m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(dob||'');
  if(!m)return null;
  var d=parseInt(m[1],10),mo=parseInt(m[2],10)-1;
  var today=new Date();today.setHours(0,0,0,0);
  var y=today.getFullYear();
  var next=new Date(y,mo,d);
  if(next<today)next=new Date(y+1,mo,d);
  var daysUntil=Math.round((next-today)/86400000);
  var monthNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return{daysUntil:daysUntil,label:monthNames[next.getMonth()]+' '+next.getDate()};
}
function birthdayText(dob){

  return'In '+nb.daysUntil+' days ('+nb.label+')';

function tryPortalPinDigit(d){

function getPIN(){return localStorage.getItem(nsKey('genlec_pin'))||'1234';}

   across every business on the same device instead of scoped per
   business like everything else here. Setting it on one business would
   silently overwrite what another business showed on its own welcome
   screen. nsKey() gives it the same per-business scoping SK/BIO_KEY
   already use. The old hardcoded 'Leroy Joubert' fallback is also gone
   -- a specific person's name has no business being the default for
   every new business that's never set this; renderWelcomeSplash() below
   simply omits the name line when nothing's been personalized yet. */
function getDisplayName(){return localStorage.getItem(nsKey('genlec_display_name'))||'';}

function authOK(role,skipWelcome){
  G.authed=true;G.role=role||'owner';pinEntry='';pinAttempts=0;pinLocked=false;lastActive=Date.now();haptic([30,20,30]);
  if(!skipWelcome){

function tryPIN(d){
  if(pinLocked&&Date.now()<pinLockUntil){render();return;}
  if(d==='del'){pinEntry=pinEntry.slice(0,-1);render();return;}
  pinEntry+=d;render();
  if(pinEntry.length===4){
    var ownerPin=getOwnerPIN();
    if(pinEntry===getPIN()){
      /* If a distinct owner PIN has been set, the general PIN is preparer-only.
         If no owner PIN has ever been configured, the single PIN keeps full
         owner access -- this is what makes the feature backward-compatible
         with every existing installation. */
      authOK(ownerPin?'preparer':'owner');
    }else if(ownerPin&&pinEntry===ownerPin){
      authOK('owner');
    }else{
      pinAttempts++;
      if(pinAttempts>=3){pinLocked=true;pinLockUntil=Date.now()+300000;pinEntry='';render();}
      else{haptic(100);setTimeout(function(){pinEntry='';render();},600);}

/* ── Biometric unlock (WebAuthn, platform authenticator) ──
   This is a LOCAL, single-device convenience unlock, not a server-verified
   login. It still requires the device's real Face ID / Touch ID / fingerprint
   / Windows Hello check to succeed before it will unlock -- the browser and
   OS enforce that -- but there's no server checking the cryptographic
   signature, since this app has no traditional backend. Treat it the same
   as the PIN: convenient for a personal or trusted device, not a substitute
   for keeping the underlying data itself secured (see SYNC_TOKEN notes). */

    if(newPin&&pinInUseByEmployee(newPin,id)){
      showAlert('That PIN is already assigned to another staff member - portal PIN was not changed.');
    }else if(newPin&&pinCollidesWithAdmin(newPin)){
      showAlert('That PIN matches the owner/preparer PIN - choose a different one, or an employee logging in with it would unlock the full admin app.');
    }else if(newPin!==(e.pin||'')){
      /* Any time the admin sets or resets this PIN, the employee is required
         to choose their own on next login -- this covers both a brand-new
         portal login and a "forgot my PIN" reset. */
      e.pin=newPin;e.pinChanged=false;
    }
  }
  if(!G.paid['a'+G.mo]){
    var holVal=parseFloat(document.getElementById('fh').value)||0;
    if(!e.holPerMonth)e.holPerMonth={};
    e.holPerMonth[G.mo]=holVal;

    var advType=document.getElementById('fa-type')?document.getElementById('fa-type').value:'once';
    if(!e.advPerMonth)e.advPerMonth={};

      var inst=parseFloat(document.getElementById('fa-install').value)||0;
      var startMo=parseInt(document.getElementById('fa-startmo').value);
      if(inst<=0||inst>advVal)inst=advVal;
      var months=Math.ceil(advVal/inst);
      var rem=advVal;
      for(var mi=0;mi<months;mi++){
        var mo=(startMo+mi)%12;
        var repay=Math.round(Math.min(inst,rem)*100)/100;
        if(!G.paid['a'+mo]){
          e.advPerMonth[mo]=repay;

        rem=Math.round((rem-repay)*100)/100;
        if(rem<=0)break;
      }
      G.log.push({ts:nowTs(),msg:'Advance installment: '+e.name+' - '+fE(advVal)+' over '+months+' months from '+MONTHS[startMo]});
    }else{

/* Automatic backup: fires right when a month is approved & paid, so there is
   always a snapshot from the moment payroll closes, not just whenever
   someone remembers to export manually. Stores a dated snapshot in
   localStorage (survives even if the download below is blocked) and
   attempts a real file download too. */
function autoBackupAfterPay(paidMo){
  try{
    var snapshot={emps:G.emps,paid:G.paid,prepared:G.prepared,log:G.log,mo:paidMo,year:CY,timestamp:nowTs()};
    localStorage.setItem(nsKey('genlec_snapshot_'+CY+'_'+paidMo),JSON.stringify(snapshot));
  }catch(e){/* snapshot best-effort; download attempt below still runs */}
  try{
    var blob=new Blob([JSON.stringify({emps:G.emps,paid:G.paid,prepared:G.prepared,log:G.log,mo:paidMo},null,2)],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download='vakasha-backup-'+MONTHS[paidMo]+'-'+CY+'-paid.json';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
  }catch(e){/* download best-effort; snapshot above still ran */}
}

/* ── Custom alert/confirm, styled to match the rest of the app instead of
   the browser's native grey popup. Native alert()/confirm() are
   synchronous and block the whole page; these are async (they render a
   modal and call back once the person responds), so every former call

function showAlert(message,onClose){

  render();
}
function closeAlertBox(){
  var cb=G._alertBox&&G._alertBox.onClose;

}
function showConfirm(message,onYes,onNo){

function resolveConfirmBox(yes){
  var box=G._confirmBox;

  ctx.arcTo(x+w,y+h,x,y+h,r);

  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();

    ctx.fillStyle='#0f172a';ctx.textAlign='left';
    var nameSize=19;var nameMaxW=W-padX*2;
    ctx.font='bold '+nameSize+'px system-ui,-apple-system,sans-serif';
    while(ctx.measureText(emp.name).width>nameMaxW&&nameSize>12){nameSize--;ctx.font='bold '+nameSize+'px system-ui,-apple-system,sans-serif';}
    ctx.fillText(emp.name,padX,headerH+24);
    var ry=headerH+nameH+22;
    data.rows.forEach(function(r){
      ctx.fillStyle='#6b7280';ctx.font='15px system-ui,-apple-system,sans-serif';ctx.textAlign='left';

    ctx.beginPath();ctx.moveTo(padX,ry-rowH+12);ctx.lineTo(W-padX,ry-rowH+12);ctx.stroke();
    ctx.fillStyle='#0f172a';ctx.font='bold 17px system-ui,-apple-system,sans-serif';ctx.textAlign='left';
    ctx.fillText('Net payout',padX,ry+14);
    ctx.fillStyle='#16a34a';ctx.font='bold 25px system-ui,-apple-system,sans-serif';ctx.textAlign='right';
    ctx.fillText(fE(data.net),W-padX,ry+18);

  }
  var logoSrc=window.LOGO_DATA;
  if(logoSrc){

/* Turns a canvas into a real single-page PDF, built byte-by-byte with no
   external library (jsPDF etc. would need a CDN, which breaks working
   offline at the lodge -- everything here runs from what's already in
   this file). A PDF embedding one JPEG image is a well-defined, simple
   structure, so this is safe to hand-build rather than pull in a library
   for. */
function canvasToPdfBlob(canvas){
  var dataUrl=canvas.toDataURL('image/jpeg',0.92);
  var b64=dataUrl.split(',')[1];
  var bin=atob(b64);
  var jpegBytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)jpegBytes[i]=bin.charCodeAt(i);
  var wPt=Math.round(canvas.width/2),hPt=Math.round(canvas.height/2); // canvas drawn at 2x scale, so /2 gives sensible point size
  var enc=new TextEncoder();
  var parts=[];var offsets=[];var pos=0;
  function push(bytes){parts.push(bytes);pos+=bytes.length;}
  function pushStr(s){push(enc.encode(s));}
  pushStr('%PDF-1.4\n');
  offsets[1]=pos;pushStr('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  offsets[2]=pos;pushStr('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
  offsets[3]=pos;pushStr('3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+wPt+' '+hPt+'] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n');
  offsets[4]=pos;pushStr('4 0 obj\n<< /Type /XObject /Subtype /Image /Width '+canvas.width+' /Height '+canvas.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpegBytes.length+' >>\nstream\n');
  push(jpegBytes);
  pushStr('\nendstream\nendobj\n');
  var content='q '+wPt+' 0 0 '+hPt+' 0 0 cm /Im0 Do Q';
  offsets[5]=pos;pushStr('5 0 obj\n<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream\nendobj\n');
  var xrefStart=pos;
  var xref='xref\n0 6\n0000000000 65535 f \n';
  for(var oi=1;oi<=5;oi++)xref+=String(offsets[oi]).padStart(10,'0')+' 00000 n \n';
  pushStr(xref);
  pushStr('trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xrefStart+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}
function sharePayslipImage(empId){
  var emp=G.emps.find(function(x){return x.id===empId;});if(!emp)return;
  if(G._sharingPayslip)return; // guards against a double-tap/double-fire triggering two downloads
  G._sharingPayslip=true;
  setTimeout(function(){G._sharingPayslip=false;},2000);
  generatePayslipCanvas(emp,function(canvas){
    canvas.toBlob(function(blob){
      if(!blob){showAlert('Could not generate the payslip image on this device.');return;}
      var filename='payslip-'+emp.name.replace(/\s+/g,'-')+'-'+MONTHS[G.mo]+'-'+CY+'.png';
      var file;
      try{file=new File([blob],filename,{type:'image/png'});}catch(e){file=null;}
      if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
        /* On devices/browsers that support it (Mac Safari, most mobile
           browsers) this opens the native share sheet -- AirDrop, Mail,
           Messages, WhatsApp, etc. all show up here as real OS-level
           options, which is better than anything a web page can offer
           directly, so this path is left alone rather than routed
           through a custom picker. */
        navigator.share({files:[file],title:'Payslip - '+emp.name}).catch(function(){/* user cancelled */});
      }else{
        downloadBlobFile(blob,filename);
        showAlert('This browser can\'t hand an image straight to an app from here, so the payslip image has been downloaded instead - attach it to WhatsApp (or anywhere else) manually from your downloads/photos.');
      }
    },'image/png');
  });
}
function downloadPayslipPdf(empId){
  var emp=G.emps.find(function(x){return x.id===empId;});if(!emp)return;
  if(G._downloadingPayslipPdf)return;
  G._downloadingPayslipPdf=true;
  setTimeout(function(){G._downloadingPayslipPdf=false;},2000);
  generatePayslipCanvas(emp,function(canvas){
    var pdfBlob=canvasToPdfBlob(canvas);
    var pdfName='payslip-'+emp.name.replace(/\s+/g,'-')+'-'+MONTHS[G.mo]+'-'+CY+'.pdf';
    downloadBlobFile(pdfBlob,pdfName);
  });
}
